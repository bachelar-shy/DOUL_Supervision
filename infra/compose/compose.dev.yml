name: doul-supervision-dev

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DOUL_API_DEMO: "true"
      DOUL_API_DATABASE: /data/mvp.sqlite3
      DOUL_API_HOST: 0.0.0.0
      DOUL_API_PORT: "8791"
      DOUL_API_LOG_LEVEL: ${DOUL_API_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${DOUL_API_PORT_PUBLISHED:-8791}:8791"
    volumes:
      - api-data:/data
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DOUL_WEB_PORT_PUBLISHED:-5181}:8080"
    restart: unless-stopped

volumes:
  api-data:
