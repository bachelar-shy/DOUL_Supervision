name: doul-supervision-dev

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DOUL_API_DEMO: "true"
      DOUL_API_DATABASE: /data/mvp.sqlite3
      DOUL_API_HOST: 0.0.0.0
      DOUL_API_PORT: "8791"
      DOUL_API_LOG_LEVEL: ${DOUL_API_LOG_LEVEL:-info}
      DOUL_API_ALLOWED_ORIGINS: "http://127.0.0.1:${DOUL_WEB_PORT_PUBLISHED:-5181},http://localhost:${DOUL_WEB_PORT_PUBLISHED:-5181},http://127.0.0.1:${DOUL_API_PORT_PUBLISHED:-8791},http://localhost:${DOUL_API_PORT_PUBLISHED:-8791}"
      DATABASE_URL: ${DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DOUL_API_PORT_PUBLISHED:-8791}:8791"
    volumes:
      - api-data:/data
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DOUL_WEB_PORT_PUBLISHED:-5181}:8080"
    restart: unless-stopped

  postgres-permissions:
    image: alpine:3.24.1
    user: root
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: ["sh", "-ec", "chown -R 70:70 /var/lib/postgresql/data"]
    restart: "no"

  postgres:
    image: doul-supervision-postgres-dev:16.15
    build:
      context: ../..
      dockerfile: infra/docker/postgres-dev.Dockerfile
    depends_on:
      postgres-permissions:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${DOUL_POSTGRES_DB:-doul_supervision}
      POSTGRES_USER: ${DOUL_POSTGRES_USER:-doul_dev}
      POSTGRES_PASSWORD: ${DOUL_POSTGRES_PASSWORD:-local-postgres-only}
    ports:
      - "127.0.0.1:${DOUL_POSTGRES_PORT_PUBLISHED:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine3.21
    environment:
      REDISCLI_AUTH: ${DOUL_REDIS_PASSWORD:-local-redis-only}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${DOUL_REDIS_PASSWORD:-local-redis-only}
    ports:
      - "127.0.0.1:${DOUL_REDIS_PORT_PUBLISHED:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  object-storage-permissions:
    image: alpine:3.24.1
    user: root
    volumes:
      - object-storage-rustfs-data:/data
    command: ["sh", "-ec", "chown -R 10001:10001 /data"]
    restart: "no"

  object-storage:
    image: rustfs/rustfs:1.0.1
    depends_on:
      object-storage-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${DOUL_OBJECT_STORAGE_ACCESS_KEY:-doul-dev}
      RUSTFS_SECRET_KEY: ${DOUL_OBJECT_STORAGE_SECRET_KEY:-local-minio-only}
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "127.0.0.1:${DOUL_OBJECT_STORAGE_PORT_PUBLISHED:-9000}:9000"
      - "127.0.0.1:${DOUL_OBJECT_STORAGE_CONSOLE_PORT_PUBLISHED:-9001}:9001"
    volumes:
      - object-storage-rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  object-storage-init:
    image: rustfs/rc:v0.1.36
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${DOUL_OBJECT_STORAGE_ACCESS_KEY:-doul-dev}
      RUSTFS_SECRET_KEY: ${DOUL_OBJECT_STORAGE_SECRET_KEY:-local-minio-only}
      OBJECT_STORAGE_BUCKET: ${DOUL_OBJECT_STORAGE_BUCKET:-doul-supervision-dev}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rc alias set local http://object-storage:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY"
        rc mb --ignore-existing "local/$$OBJECT_STORAGE_BUCKET"
        rc anonymous set private "local/$$OBJECT_STORAGE_BUCKET"
        rc ls "local/$$OBJECT_STORAGE_BUCKET"
    restart: "no"

volumes:
  api-data:
  postgres-data:
  redis-data:
  object-storage-rustfs-data:
