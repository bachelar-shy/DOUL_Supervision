# Explicit opt-in for a password-backed staging/pilot API.
# Compose with -f compose.operational.yml -f compose.operational.password.yml.
services:
  api:
    environment:
      DOUL_AUTH_MODE: local-password
      DOUL_AUTH_PRIVATE_KEY_FILE: /run/secrets/auth-private-key
    secrets:
      - api-database-url
      - api-redis-url
      - auth-public-key
      - api-alert-token
      - service-ca-bundle
      - auth-private-key
secrets:
  auth-private-key:
    file: "${DOUL_SECRETS_DIR:?}/auth-private-key"
