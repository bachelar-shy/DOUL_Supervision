    environment: {DOUL_ENVIRONMENT: pilot, DOUL_API_DEMO: "false"}
  worker-runtime:
    entrypoint: []
    environment: {DOUL_ENVIRONMENT: pilot, DOUL_QUEUE_NAMESPACE: "doul:pilot:media", DOUL_WORKER_HEARTBEAT_KEY: "doul:pilot:worker:heartbeat"}
  monitor:
    environment: {DOUL_ENVIRONMENT: pilot, DOUL_QUEUE_NAMESPACE: "doul:pilot:media"}
