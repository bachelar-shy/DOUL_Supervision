worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  log_format safe_json escape=json '{"component":"proxy","event":"request","method":"$request_method","status":$status,"requestId":"$request_id"}';
  access_log /dev/stdout safe_json;
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  server {
    listen 8443 ssl;
    ssl_certificate /run/secrets/tls-certificate;
    ssl_certificate_key /run/secrets/tls-private-key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 64m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location /api/ {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://api:8791/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_read_timeout 100s;
      proxy_send_timeout 100s;
    }
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store" always;
    }
  }
}
