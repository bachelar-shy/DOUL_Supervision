openapi: 3.1.0
info:
  title: DOUL Supervision Core API
  version: 2.0.0
paths:
  /projects/{projectId}/registers/{registerId}:
    get: {summary: 관리대장 Projection 조회, responses: {'200': {description: OK}}}
  /records/{recordId}:
    get: {summary: 기록 상세, responses: {'200': {description: OK}}}
  /inspections:
    post: {summary: 검측 생성, responses: {'201': {description: Created}}}
  /inspections/{inspectionId}/request:
    post: {summary: 시공사 검측요청, responses: {'200': {description: Transitioned}, '409': {description: Gate failed}}}
  /inspections/{inspectionId}/start:
    post: {summary: 감리 검측 시작, responses: {'200': {description: Transitioned}, '403': {description: Not authorized}}}
  /inspections/{inspectionId}/result:
    post: {summary: 검측 판정 제출, responses: {'200': {description: Transitioned}, '409': {description: Gate failed}}}
  /evidence:
    post: {summary: 원본 또는 파생 Evidence 등록, responses: {'201': {description: Created}}}
  /observations:
    post: {summary: Observation Candidate 생성, responses: {'201': {description: Created}}}
  /observations/{observationId}/confirm:
    post: {summary: 권한 있는 감리자가 Observation 확인, responses: {'200': {description: Confirmed}, '403': {description: Not authorized}}}
  /observations/{observationId}/reject:
    post: {summary: Observation 기각, responses: {'200': {description: Rejected}}}
  /issues:
    post: {summary: 공식 Issue/NCR 발행, responses: {'201': {description: Created}, '403': {description: Not authorized}}}
  /issues/{issueId}/assign:
    post: {summary: Issue 담당 지정, responses: {'200': {description: Assigned}}}
  /issues/{issueId}/corrective-actions:
    post: {summary: 시공사 시정조치 제출, responses: {'201': {description: Submitted}}}
  /issues/{issueId}/request-reinspection:
    post: {summary: 시공사 재검측 요청, responses: {'200': {description: Ready for reinspection}}}
  /issues/{issueId}/close:
    post: {summary: 감리 종결, responses: {'200': {description: Closed}, '403': {description: Not authorized}, '409': {description: Gate failed}}}
  /owner-decisions:
    post: {summary: 발주처 의사결정 요청 생성, responses: {'201': {description: Created}}}
  /owner-decisions/{decisionId}/decide:
    post: {summary: 발주처 결정 기록, responses: {'200': {description: Decided}, '403': {description: Not authorized}}}
  /roles:
    get: {summary: 프로젝트 RoleAssignment 조회, responses: {'200': {description: OK}}}
  /roles/{roleAssignmentId}/authorities:
    get: {summary: 현재 유효 Authority 조회, responses: {'200': {description: OK}}}
  /forms/{formId}/preview:
    post: {summary: DOUL A4 HTML 미리보기, responses: {'200': {description: Preview}}}
  /forms/{formId}/render:
    post: {summary: DOCX/PDF 스냅샷 생성, responses: {'201': {description: Created}, '422': {description: Required legal field missing}}}
  /legal-forms/{legalFormId}/render:
    post: {summary: 베트남 공식 고정서식 데이터 채움, responses: {'201': {description: Created}}}
  /documents/{documentId}/sign:
    post: {summary: 자격·권한 확인 후 서명, responses: {'200': {description: Signed}, '403': {description: Not authorized}}}
  /dashboards/open-items:
    get: {summary: 미결사항 통합현황, responses: {'200': {description: OK}}}
  /dashboards/legal-completeness:
    get: {summary: 베트남 법정문서 완성도, responses: {'200': {description: OK}}}
