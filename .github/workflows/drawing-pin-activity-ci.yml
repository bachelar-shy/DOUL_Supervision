name: drawing-pin-activity
on:
  pull_request:
    paths:
      - 'services/api/modules/drawing_sheets.py'
      - 'tests_mvp/test_drawing_pin_activity_http.py'
      - 'apps/web/src/pages/TodayDrawingActivity.tsx'
      - 'apps/web/src/pages/TodayPage.tsx'
      - 'apps/web/src/app/AppShell.tsx'
      - 'apps/web/src/data/drawing-pin-activity-client.ts'
      - '.github/workflows/drawing-pin-activity-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/modules/drawing_sheets.py'
      - 'tests_mvp/test_drawing_pin_activity_http.py'
      - 'apps/web/src/pages/TodayDrawingActivity.tsx'
      - 'apps/web/src/pages/TodayPage.tsx'
      - 'apps/web/src/app/AppShell.tsx'
      - '.github/workflows/drawing-pin-activity-ci.yml'
permissions:
  contents: read
jobs:
  drawing-pin-activity-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked HTTP dependencies and Poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install -r services/api/requirements.lock
      - name: Verify permission-scoped drawing activity projection
        run: python -m unittest tests_mvp.test_drawing_pin_activity_http -v
