name: translation-cloud-ci
on:
  pull_request:
    paths:
      - ".github/workflows/translation-cloud-ci.yml"
      - "services/api/modules/translation_preview.py"
      - "services/api/main.py"
      - "apps/web/src/pages/TranslationPreviewPanel.tsx"
      - "apps/web/src/pages/DocumentPage.tsx"
      - "tests/test_translation_preview.py"
permissions:
  contents: read
jobs:
  translation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          cache: npm
      - name: Install pinned dependencies
        run: |
          python -m pip install -r services/api/requirements.lock
          npm install -g npm@12.2.0
          npm ci
      - name: Translation adapter and guards
        run: python -m unittest tests.test_translation_preview -v
      - name: Web build and typecheck
        run: npm run web:build
