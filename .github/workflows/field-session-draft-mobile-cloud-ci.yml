name: field-session-draft-mobile-cloud-ci
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/field-session-draft-mobile-cloud-ci.yml"
      - "apps/web/src/data/session-form-draft.ts"
      - "apps/web/src/pages/InspectionAuthoringPanel.tsx"
      - "apps/web/src/App.tsx"
      - "apps/web/src/main.tsx"
      - "apps/web/src/site-mobile-readability.css"
      - "tests_browser_launch/field-session-draft-mobile.spec.ts"
permissions:
  contents: read
jobs:
  field-draft-ux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install and compile
        run: |
          npm install -g npm@12.2.0
          npm ci
          npm run check:ui-boundary
          npm run web:build
      - name: Verify role-scoped drafts and mobile readability
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.field-core.config.ts field-session-draft-mobile.spec.ts
