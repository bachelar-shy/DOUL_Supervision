name: personnel-requests
on:
  pull_request:
    paths:
      - '.github/workflows/personnel-requests.yml'
      - 'services/api/main.py'
      - 'services/api/modules/personnel_requests.py'
      - 'services/api/modules/project_settings.py'
      - 'apps/web/src/app/routes.ts'
      - 'apps/web/src/app/AppShell.tsx'
      - 'apps/web/src/pages/PersonnelRequestPage.tsx'
      - 'apps/web/src/pages/ProjectSettingsPage.tsx'
      - 'tests_mvp/test_project_settings_http.py'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: personnel-requests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  auth-requests-and-ui:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r services/api/requirements.lock
          npm ci
      - name: Verify admin-only permissions, isolation and request workflow
        run: .venv/bin/python -m unittest tests_mvp.test_project_settings_http -v
      - name: Web lint and build
        run: |
          npm run check:ui-boundary
          npm run lint --workspace apps/web
          npm run web:build
