name: platform-container-baseline

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/platform-container.yml"
      - "infra/**"
      - "app/**"
      - "services/**"
      - "apps/web/**"
      - "packages/client/**"
      - "packages/localization/**"
      - "tests_mvp/test_*postgres*.py"
      - "tests_mvp/test_schedule_source_import*.py"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/platform-container.yml"
      - "infra/**"
      - "app/**"
      - "services/**"
      - "apps/web/**"
      - "packages/client/**"
      - "packages/localization/**"
      - "tests_mvp/test_*postgres*.py"
      - "tests_mvp/test_schedule_source_import*.py"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  compose-smoke:
    # Dedicated Linux VM on the Mac mini; one runner serializes jobs.
    runs-on: [self-hosted, Linux, ARM64, doul-macmini]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate Compose model
        run: docker compose -f infra/compose/compose.dev.yml config --quiet

      - name: Build local development images
        run: docker compose -f infra/compose/compose.dev.yml build

      - name: Verify runtime images declare non-root users
        run: |
          docker pull rustfs/rustfs:1.0.1
          for image in \
            doul-supervision-dev-api \
            doul-supervision-dev-web \
            doul-supervision-postgres-dev:16.15 \
            rustfs/rustfs:1.0.1; do
            runtime_user="$(docker image inspect "$image" --format '{{.Config.User}}')"
            case "$runtime_user" in
              ""|"0"|"root"|"0:0")
                echo "$image must declare a non-root runtime user"
                exit 1
                ;;
            esac
            echo "$image runtime user: $runtime_user"
          done

      - name: Scan development runtime images
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker pull "$TRIVY_IMAGE"
          mapfile -t images < <(docker compose -f infra/compose/compose.dev.yml config --images | sort -u)

          for image in "${images[@]}"; do
            echo "::group::Security report: $image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
              "$TRIVY_IMAGE" image \
              --scanners vuln \
              --no-progress \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              "$image"
            echo "::endgroup::"

            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/" \
              "$TRIVY_IMAGE" image \
              --scanners vuln \
              --no-progress \
              --ignore-unfixed \
              --severity CRITICAL \
              --exit-on-eol 1 \
              --exit-code 1 \
              "$image"
          done

      - name: Configure PostgreSQL adapter integration
        id: postgres_adapter
        run: |
          if [ ! -f services/api/postgres_store.py ] || ! grep -q 'create_postgres_persistence' services/api/persistence.py; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Backend PostgreSQL adapter is not present in this revision; SQLite fallback smoke remains active."
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          eval "$(docker compose -f infra/compose/compose.dev.yml config --format json | python3 -c 'import json,shlex,sys; e=json.load(sys.stdin)["services"]["postgres"]["environment"]; print("pg_user="+shlex.quote(e["POSTGRES_USER"])); print("pg_password="+shlex.quote(e["POSTGRES_PASSWORD"])); print("pg_db="+shlex.quote(e["POSTGRES_DB"]))')"

          make_dsn() {
            python3 - "$pg_user" "$pg_password" "$1" <<'PY'
          import sys
          from urllib.parse import quote

          user, password, database = sys.argv[1:4]
          print(
              "postgresql://"
              + quote(user, safe="")
              + ":"
              + quote(password, safe="")
              + "@postgres:5432/"
              + quote(database, safe="")
          )
          PY
          }

          database_url="$(make_dsn "$pg_db")"
          test_database_url="$(make_dsn "${pg_db}_ci_test")"
          {
            echo "DATABASE_URL=$database_url"
            echo "DOUL_TEST_POSTGRES_DSN=$test_database_url"
          } >> "$GITHUB_ENV"

      - name: Run live PostgreSQL persistence and Schedule import integration tests
        if: steps.postgres_adapter.outputs.available == 'true'
        run: |
          set -o pipefail
          docker compose -f infra/compose/compose.dev.yml up -d --wait --wait-timeout 60 postgres
          docker compose -f infra/compose/compose.dev.yml exec -T postgres \
            sh -ec 'test_db="${POSTGRES_DB}_ci_test"; dropdb --if-exists -U "$POSTGRES_USER" "$test_db"; createdb -U "$POSTGRES_USER" "$test_db"'

          test -n "$DOUL_TEST_POSTGRES_DSN"

          run_postgres_suite() {
            log_file="$1"
            shift
            docker compose -f infra/compose/compose.dev.yml run --rm --no-deps \
              -e DOUL_TEST_POSTGRES_DSN \
              -e DATABASE_URL= \
              -v "$PWD:/workspace:ro" \
              -w /workspace \
              api python -m unittest "$@" -v 2>&1 | tee "$log_file"

            grep -Eq '^Ran [1-9][0-9]* tests? in ' "$log_file"
            grep -q '^OK$' "$log_file"
            if grep -qi 'skipped' "$log_file"; then
              echo "PostgreSQL integration tests must not skip when DOUL_TEST_POSTGRES_DSN is configured."
              exit 1
            fi
          }

          run_postgres_suite \
            /tmp/postgres-persistence-tests.txt \
            tests_mvp.test_postgres_persistence.PostgresPersistenceIntegrationTests

          run_postgres_suite \
            /tmp/schedule-source-import-postgres-tests.txt \
            tests_mvp.test_schedule_source_import_postgres

      - name: Start development stack
        run: |
          docker compose -f infra/compose/compose.dev.yml up -d --wait --wait-timeout 120 api web postgres redis object-storage
          docker compose -f infra/compose/compose.dev.yml up -d object-storage-init

      - name: Verify data services
        run: |
          init_id="$(docker compose -f infra/compose/compose.dev.yml ps -aq object-storage-init)"
          test -n "$init_id"
          init_exit_code="$(timeout 90s docker wait "$init_id")"
          test "$init_exit_code" = "0"
          test "$(docker inspect -f '{{.State.Status}}' "$init_id")" = "exited"

          bucket="$(docker compose -f infra/compose/compose.dev.yml config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["object-storage-init"]["environment"]["OBJECT_STORAGE_BUCKET"])')"
          probe_object=".platform-private-policy-probe"
          docker compose -f infra/compose/compose.dev.yml run --rm --no-deps \
            -e "OBJECT_STORAGE_BUCKET=$bucket" -e "PROBE_OBJECT=$probe_object" \
            --entrypoint /bin/sh object-storage-init -ec '
              rc alias set verify http://object-storage:9000 "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY"
              printf "private-policy-probe" >"/tmp/$PROBE_OBJECT"
              rc cp "/tmp/$PROBE_OBJECT" "verify/$OBJECT_STORAGE_BUCKET/"
              rc anonymous set download "verify/$OBJECT_STORAGE_BUCKET"
              rc stat "verify/$OBJECT_STORAGE_BUCKET/$PROBE_OBJECT"
            '

          public_get_status="$(curl --silent --output /tmp/public-policy-probe.txt --write-out '%{http_code}' \
            "http://127.0.0.1:9000/$bucket/$probe_object")"
          test "$public_get_status" = "200"
          grep -q '^private-policy-probe$' /tmp/public-policy-probe.txt

          docker compose -f infra/compose/compose.dev.yml run --rm --no-deps object-storage-init

          anonymous_list_status="$(curl --silent --output /tmp/anonymous-bucket.xml --write-out '%{http_code}' \
            "http://127.0.0.1:9000/$bucket?list-type=2")"
          anonymous_get_status="$(curl --silent --output /tmp/anonymous-object.xml --write-out '%{http_code}' \
            "http://127.0.0.1:9000/$bucket/$probe_object")"
          test "$anonymous_list_status" = "403"
          test "$anonymous_get_status" = "403"

          docker compose -f infra/compose/compose.dev.yml run --rm --no-deps \
            -e "OBJECT_STORAGE_BUCKET=$bucket" -e "PROBE_OBJECT=$probe_object" \
            --entrypoint /bin/sh object-storage-init -ec '
              rc alias set verify http://object-storage:9000 "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY"
              rc stat "verify/$OBJECT_STORAGE_BUCKET/$PROBE_OBJECT"
              rc rm "verify/$OBJECT_STORAGE_BUCKET/$PROBE_OBJECT"
            '

          docker compose -f infra/compose/compose.dev.yml exec -T postgres \
            sh -ec 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          docker compose -f infra/compose/compose.dev.yml exec -T redis redis-cli ping | grep -q '^PONG$'
          curl --fail --silent http://127.0.0.1:9000/health >/dev/null

      - name: Smoke test API, Web and default Origins
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8791/health >/tmp/api-health.json &&
               curl --fail --silent http://127.0.0.1:5181/healthz >/tmp/web-health.txt &&
               curl --fail --silent http://127.0.0.1:5181/api/health >/tmp/proxied-health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Container baseline did not become healthy."
              exit 1
            fi
            sleep 2
          done
          grep -q '"status":"ok"' /tmp/api-health.json
          grep -q '"mode":"local-demo"' /tmp/proxied-health.json
          grep -q '^ok$' /tmp/web-health.txt
          if [ "${{ steps.postgres_adapter.outputs.available }}" = "true" ]; then
            python3 - <<'PY'
          import json

          for path in ("/tmp/api-health.json", "/tmp/proxied-health.json"):
              payload = json.load(open(path, encoding="utf-8"))
              assert payload["adapters"]["database"] == "postgresql-snapshot-development", payload
          PY
          fi

          login_and_workspace() {
            origin="$1"
            port="$2"
            session="$(curl --fail --silent \
              -H "Origin: $origin" \
              -H 'Content-Type: application/json' \
              --data '{"actorGroup":"SUP"}' \
              "http://127.0.0.1:$port/api/dev/sessions")"
            access_token="$(printf '%s' "$session" | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')"
            project_id="$(printf '%s' "$session" | python3 -c 'import json,sys; print(json.load(sys.stdin)["projectId"])')"
            role_id="$(printf '%s' "$session" | python3 -c 'import json,sys; print(json.load(sys.stdin)["actor"]["roleAssignmentId"])')"
            curl --fail --silent --dump-header /tmp/workspace-headers \
              -H "Origin: $origin" \
              -H "Authorization: Bearer $access_token" \
              -H "X-RoleAssignment-Id: $role_id" \
              "http://127.0.0.1:$port/api/projects/$project_id/workspace" >/tmp/workspace.json
            tr -d '\r' </tmp/workspace-headers | grep -qi "^access-control-allow-origin: $origin$"
          }

          login_and_workspace "http://127.0.0.1:5181" 5181
          login_and_workspace "http://localhost:5181" 5181

          denied_status="$(curl --silent --output /tmp/untrusted-origin.json --write-out '%{http_code}' \
            -H 'Origin: https://untrusted.example' \
            -H 'Content-Type: application/json' \
            --data '{"actorGroup":"SUP"}' \
            http://127.0.0.1:5181/api/dev/sessions)"
          test "$denied_status" = "403"
          docker compose -f infra/compose/compose.dev.yml ps -a

      - name: Verify PostgreSQL persistence across API restart
        if: steps.postgres_adapter.outputs.available == 'true'
        run: |
          python3 infra/ci/postgres_restart_probe.py create
          docker compose -f infra/compose/compose.dev.yml restart api

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8791/health >/tmp/api-restart-health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "API did not recover after container restart."
              exit 1
            fi
            sleep 2
          done

          python3 - <<'PY'
          import json

          payload = json.load(open("/tmp/api-restart-health.json", encoding="utf-8"))
          assert payload["adapters"]["database"] == "postgresql-snapshot-development", payload
          PY
          python3 infra/ci/postgres_restart_probe.py verify

      - name: Restart with alternate Web port
        run: |
          docker compose -f infra/compose/compose.dev.yml down -v --remove-orphans
          DOUL_WEB_PORT_PUBLISHED=5182 docker compose -f infra/compose/compose.dev.yml up -d

      - name: Smoke test alternate Web Origins
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5182/healthz >/tmp/web-alt-health.txt &&
               curl --fail --silent http://127.0.0.1:5182/api/health >/tmp/proxied-alt-health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Alternate-port Web stack did not become healthy."
              exit 1
            fi
            sleep 2
          done

          if [ "${{ steps.postgres_adapter.outputs.available }}" = "true" ]; then
            python3 - <<'PY'
          import json

          payload = json.load(open("/tmp/proxied-alt-health.json", encoding="utf-8"))
          assert payload["adapters"]["database"] == "postgresql-snapshot-development", payload
          PY
          fi

          login_and_workspace() {
            origin="$1"
            session="$(curl --fail --silent \
              -H "Origin: $origin" \
              -H 'Content-Type: application/json' \
              --data '{"actorGroup":"SUP"}' \
              http://127.0.0.1:5182/api/dev/sessions)"
            access_token="$(printf '%s' "$session" | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')"
            project_id="$(printf '%s' "$session" | python3 -c 'import json,sys; print(json.load(sys.stdin)["projectId"])')"
            role_id="$(printf '%s' "$session" | python3 -c 'import json,sys; print(json.load(sys.stdin)["actor"]["roleAssignmentId"])')"
            curl --fail --silent --dump-header /tmp/workspace-alt-headers \
              -H "Origin: $origin" \
              -H "Authorization: Bearer $access_token" \
              -H "X-RoleAssignment-Id: $role_id" \
              "http://127.0.0.1:5182/api/projects/$project_id/workspace" >/tmp/workspace-alt.json
            tr -d '\r' </tmp/workspace-alt-headers | grep -qi "^access-control-allow-origin: $origin$"
          }

          login_and_workspace "http://127.0.0.1:5182"
          login_and_workspace "http://localhost:5182"

          denied_status="$(curl --silent --output /tmp/untrusted-alt-origin.json --write-out '%{http_code}' \
            -H 'Origin: https://untrusted.example' \
            -H 'Content-Type: application/json' \
            --data '{"actorGroup":"SUP"}' \
            http://127.0.0.1:5182/api/dev/sessions)"
          test "$denied_status" = "403"

      - name: Container logs
        if: failure()
        run: docker compose -f infra/compose/compose.dev.yml logs --no-color

      - name: Stop development stack
        if: always()
        run: docker compose -f infra/compose/compose.dev.yml down -v --remove-orphans
