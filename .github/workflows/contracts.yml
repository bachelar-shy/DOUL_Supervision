name: contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    # Ephemeral GitHub-hosted runner; no Mac mini dependency.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r services/api/requirements.lock
          python scripts/dependency_environment.py --python .venv/bin/python
      - name: Cross-contract validation
        run: .venv/bin/python scripts/validate_contracts.py
      - name: Generated API and types are current
        run: |
          .venv/bin/python scripts/generate_api.py --check
          .venv/bin/python scripts/generate_types.py --check
      - name: Workflow, authority, media and document scenarios
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python -m unittest discover -s tests_contracts -v
