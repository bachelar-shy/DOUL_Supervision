name: contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Cross-contract validation
        run: python scripts/validate_contracts.py
      - name: Generated API and types are current
        run: |
          python scripts/generate_api.py --check
          python scripts/generate_types.py --check
      - name: Workflow, authority, media and document scenarios
        run: python -m unittest discover -s tests -v
