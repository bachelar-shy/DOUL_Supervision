name: drawing-sheet-viewer
on:
  pull_request:
    paths:
      - '.github/workflows/drawing-sheet-viewer-ci.yml'
      - 'apps/web/src/app/AppShell.tsx'
      - 'apps/web/src/pages/DrawingSheetWorkspace.tsx'
      - 'apps/web/src/pages/drawing-sheet-workspace.css'
      - 'apps/web/src/data/drawing-sheet-client.ts'
      - 'apps/web/src/data/supervision-client.ts'
      - 'apps/web/src/data/mock-supervision-client.ts'
      - 'playwright.drawing-sheets.config.ts'
      - 'tests_browser_sheets/**'
      - 'services/api/modules/drawing_sheets.py'
      - 'services/api/modules/drawing_sheet_annotations.py'
      - 'apps/web/src/pages/DrawingMarkupCanvas.tsx'
      - 'tests_mvp/test_drawing_sheet_markups_http.py' 
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: drawing-sheet-viewer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fieldwire-like-sheet-workflow:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m venv .venv
          .venv/bin/pip install -r services/api/requirements.lock
          npm ci
          npx playwright install --with-deps chromium
      - name: Sheet markup role, persistence and undo/redo API tests
        run: .venv/bin/python -m unittest tests_mvp.test_drawing_sheet_markups_http -v
      - name: UI lint and build
        env:
          VITE_DOUL_AUTH_MODE: password
        run: |
          npm run check:ui-boundary
          npm run lint --workspace apps/web
          npm run web:build
      - name: PDF upload, sheet views, pin side rail and role restrictions on desktop and phone
        run: npx playwright test -c playwright.drawing-sheets.config.ts
