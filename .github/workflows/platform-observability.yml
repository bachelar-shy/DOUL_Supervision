name: platform-observability
on:
  pull_request:
    paths: ['.github/workflows/platform-observability.yml', 'infra/observability/**', 'infra/compose/**', 'services/**', 'tests_mvp/test_observability.py', 'tests_runtime/observability_live.py']
  push:
    branches: [main]
    paths: ['.github/workflows/platform-observability.yml', 'infra/observability/**', 'infra/compose/**', 'services/**', 'tests_mvp/test_observability.py', 'tests_runtime/observability_live.py']
permissions:
  contents: read
jobs:
  runtime-health-contract:
    # Ephemeral GitHub-hosted runner; no Mac mini dependency.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, doul-macmini]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare ephemeral runner disk for CI
        run: bash infra/ci/prepare_github_runner.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked runtime
        run: pip install -r services/api/requirements.lock
      - name: Verify health, metrics, private logs and alert retries
        run: |
          python -m unittest discover -s infra/observability -p 'test_*.py' -v
          python -m unittest discover -s tests_mvp -p test_observability.py -v
      - name: Start disposable integrated runtime
        run: |
          docker compose -f infra/compose/compose.dev.yml -f infra/compose/compose.worker.yml \
            up -d --build --wait --wait-timeout 120 postgres redis api worker-runtime object-storage
          docker compose -f infra/compose/compose.dev.yml -f infra/compose/compose.worker.yml run --rm --no-deps object-storage-init
      - name: Verify live capacity, queue, worker and API signals
        env:
          DATABASE_URL: postgresql://doul_dev:local-postgres-only@127.0.0.1:5432/doul_supervision
          REDIS_URL: redis://:local-redis-only@127.0.0.1:6379/0
          OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
          OBJECT_STORAGE_ACCESS_KEY: doul-dev
          OBJECT_STORAGE_SECRET_KEY: local-minio-only
          OBJECT_STORAGE_BUCKET: doul-supervision-dev
        run: |
          python -m tests_runtime.observability_live
          python -m services.observability --demo
      - name: Runtime logs
        if: failure()
        run: docker compose -f infra/compose/compose.dev.yml -f infra/compose/compose.worker.yml logs --no-color --tail 100 api worker-runtime
      - name: Stop disposable runtime
        if: always()
        run: docker compose -f infra/compose/compose.dev.yml -f infra/compose/compose.worker.yml down -v --remove-orphans
