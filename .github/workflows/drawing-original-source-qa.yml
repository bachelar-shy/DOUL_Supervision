name: drawing-original-source-qa
on:
  pull_request:
    paths:
      - "scripts/verify_drawing_originals.py"
      - "tests_mvp/test_drawing_originals_cli.py"
      - "tests_mvp/test_import_registered_drawing_cli.py"
      - "scripts/import_registered_drawing.py"
      - ".github/workflows/drawing-original-source-qa.yml"
  push:
    branches: [main]
    paths:
      - "scripts/verify_drawing_originals.py"
      - "tests_mvp/test_drawing_originals_cli.py"
      - "tests_mvp/test_import_registered_drawing_cli.py"
      - "scripts/import_registered_drawing.py"
      - ".github/workflows/drawing-original-source-qa.yml"
permissions:
  contents: read
jobs:
  source-catalog-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Original catalog QA contract (no network or staging secrets)
        run: python -m unittest tests_mvp.test_drawing_originals_cli tests_mvp.test_import_registered_drawing_cli -v
