name: document-session-draft-cloud-ci
on:
  pull_request:
    paths:
      - ".github/workflows/document-session-draft-cloud-ci.yml"
      - "apps/web/src/pages/DocumentPage.tsx"
      - "apps/web/src/pages/document-authoring-copy.ts"
      - "apps/web/src/pages/document-authoring.css"
      - "apps/web/src/data/session-form-draft.ts"
      - "tests_browser_launch/document-session-draft.spec.ts"
permissions:
  contents: read
jobs:
  document-draft:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install and build
        run: |
          npm install -g npm@12.2.0
          npm ci
          npm run check:ui-boundary
          npm run web:build
      - name: Verify decision and review-table draft recovery
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.field-core.config.ts document-session-draft.spec.ts document-authoring-ux.spec.ts
