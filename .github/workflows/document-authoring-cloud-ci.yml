name: document-authoring-cloud-ci

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/document-authoring-cloud-ci.yml"
      - "apps/web/src/pages/DocumentPage.tsx"
      - "apps/web/src/pages/DocumentTableEditor.tsx"
      - "apps/web/src/pages/document-authoring-source.ts"
      - "apps/web/src/pages/document-authoring.css"
      - "apps/web/src/data/supervision-client.ts"
      - "apps/web/src/data/mock-supervision-client.ts"
      - "apps/web/src/data/mock-workspace.ts"
      - "tests_browser_launch/document-authoring-ux.spec.ts"
      - "tests_browser/document-authoring-connected.spec.ts"

permissions:
  contents: read

jobs:
  form-authoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install dependencies
        run: |
          npm install --global npm@12.2.0
          npm ci
          python -m venv .venv
          .venv/bin/pip install -r services/api/requirements.lock
      - name: Build UI
        run: |
          npm run check:ui-boundary
          npm run web:build
      - name: Validate snapshot and authorized export semantics
        run: .venv/bin/python -m unittest tests_mvp.test_documents_http tests_mvp.test_document_runtime -v
      - name: Browser checks for source and editable tables
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.field-core.config.ts document-authoring-ux.spec.ts
      - name: Authorized draft and exporter not installed behaviour
        run: npx playwright test -c playwright.config.ts document-authoring-connected.spec.ts
      - name: Existing versioned document workspace regression
        run: npx playwright test -c playwright.config.ts workspace.spec.ts --grep "draft document renders from versioned source"
