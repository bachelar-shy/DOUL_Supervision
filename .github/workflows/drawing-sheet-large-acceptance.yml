name: drawing-sheet-large-acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/drawing-sheet-large-acceptance.yml'
      - 'tests_mvp/test_drawing_large_pdf_acceptance.py'
      - 'services/api/modules/drawing_sheets.py'
      - 'services/api/modules/drawing_raster.py'
      - 'apps/web/src/data/drawing-sheet-client.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drawing-large-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-56mb-145pages:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Locked API dependencies and PDF image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m venv .venv
          .venv/bin/pip install -r services/api/requirements.lock
      - name: Synthetic 56 MiB 145-page upload, registration and raster regression
        run: .venv/bin/python -m unittest tests_mvp.test_drawing_large_pdf_acceptance -v
