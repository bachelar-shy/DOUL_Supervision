name: project-settings
on:
  pull_request:
    paths:
      - '.github/workflows/project-settings.yml'
      - 'apps/web/src/**'
      - 'packages/client/src/**'
      - 'services/api/**'
      - 'services/deployment/**'
      - 'scripts/install_site_test_project.py'
      - 'scripts/project_settings_browser_server.py'
      - 'scripts/test_project_session_races.mjs'
      - 'tests_mvp/test_project_settings_http.py'
      - 'tests_browser_settings/**'
      - 'playwright.project-settings.config.ts'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: project-settings-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  settings-and-project-isolation:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, doul-macmini]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: bash infra/ci/prepare_github_runner.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Locked dependencies
        run: |
          npm install --global npm@12.2.0
          npm ci
          python -m venv .venv
          .venv/bin/pip install -r services/api/requirements.lock
      - name: Authority, persistence and session checks
        run: |
          .venv/bin/python -m unittest tests_mvp.test_project_settings_http tests_mvp.test_password_login_http tests_mvp.test_password_auth tests_mvp.test_password_deployment_modes -v
          node scripts/test_project_session_races.mjs
          .venv/bin/python infra/ci/verify_github_runner_workflows.py
      - name: Build and connected HTTPS desktop/phone checks
        env:
          VITE_DOUL_AUTH_MODE: password
        run: |
          npm run check:ui-boundary
          npm run lint --workspace apps/web
          npm run web:build
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.project-settings.config.ts
          npx playwright test -c playwright.auth.config.ts
          npx playwright test -c playwright.field-core.config.ts
