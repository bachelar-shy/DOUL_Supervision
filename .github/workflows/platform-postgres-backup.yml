name: platform-postgres-backup

on:
  pull_request:
    paths:
      - ".github/workflows/platform-postgres-backup.yml"
      - "infra/backup/**"
      - "infra/compose/compose.dev.yml"
      - "infra/docker/postgres-dev.Dockerfile"
  push:
    branches: [main]
    paths:
      - ".github/workflows/platform-postgres-backup.yml"
      - "infra/backup/**"
      - "infra/compose/compose.dev.yml"
      - "infra/docker/postgres-dev.Dockerfile"

permissions:
  contents: read

jobs:
  clean-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate backup scripts
        run: |
          sh -n infra/backup/postgres_backup.sh
          sh -n infra/backup/postgres_restore_clean.sh
          docker compose -f infra/compose/compose.dev.yml config --quiet

      - name: Start PostgreSQL
        run: |
          docker compose -f infra/compose/compose.dev.yml \
            up -d --wait --wait-timeout 60 postgres

      - name: Seed backup source database
        run: |
          docker compose -f infra/compose/compose.dev.yml exec -T postgres \
            sh -ec '
              dropdb --if-exists -U "$POSTGRES_USER" doul_backup_probe
              createdb -T template0 -U "$POSTGRES_USER" doul_backup_probe
              psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d doul_backup_probe \
                -c "CREATE TABLE platform_restore_probe (id integer PRIMARY KEY, payload text NOT NULL);" \
                -c "INSERT INTO platform_restore_probe (id, payload) VALUES (1, '"'"'snapshot-v1'"'"');"
            '

      - name: Create and verify backup
        run: |
          mkdir -p /tmp/doul-backup
          infra/backup/postgres_backup.sh \
            doul_backup_probe \
            /tmp/doul-backup/probe.dump

          test -s /tmp/doul-backup/probe.dump
          test -s /tmp/doul-backup/probe.dump.sha256
          expected="$(cat /tmp/doul-backup/probe.dump.sha256)"
          actual="$(sha256sum /tmp/doul-backup/probe.dump | awk '{print $1}')"
          test "$expected" = "$actual"

      - name: Restore into clean database
        run: |
          infra/backup/postgres_restore_clean.sh \
            /tmp/doul-backup/probe.dump \
            doul_restore_probe

          restored="$(docker compose -f infra/compose/compose.dev.yml exec -T postgres \
            sh -ec 'psql -At -U "$POSTGRES_USER" -d doul_restore_probe -c "SELECT payload FROM platform_restore_probe WHERE id=1"')"
          test "$restored" = "snapshot-v1"

      - name: Reject corrupted dump and primary overwrite
        run: |
          cp /tmp/doul-backup/probe.dump /tmp/doul-backup/corrupt.dump
          cp /tmp/doul-backup/probe.dump.sha256 /tmp/doul-backup/corrupt.dump.sha256
          printf 'corrupt' >> /tmp/doul-backup/corrupt.dump

          if infra/backup/postgres_restore_clean.sh \
            /tmp/doul-backup/corrupt.dump \
            doul_corrupt_probe; then
            echo "corrupted dump must be rejected"
            exit 1
          fi

          primary="$(docker compose -f infra/compose/compose.dev.yml exec -T postgres \
            sh -ec 'printf "%s" "$POSTGRES_DB"')"
          if infra/backup/postgres_restore_clean.sh \
            /tmp/doul-backup/probe.dump \
            "$primary"; then
            echo "primary database clean restore must be refused"
            exit 1
          fi

          exists="$(docker compose -f infra/compose/compose.dev.yml exec -T postgres \
            sh -ec 'psql -At -U "$POSTGRES_USER" -d postgres -c "SELECT 1 FROM pg_database WHERE datname='"'"'doul_corrupt_probe'"'"'"')"
          test -z "$exists"

      - name: PostgreSQL logs
        if: failure()
        run: docker compose -f infra/compose/compose.dev.yml logs --no-color postgres

      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f infra/compose/compose.dev.yml down -v --remove-orphans
