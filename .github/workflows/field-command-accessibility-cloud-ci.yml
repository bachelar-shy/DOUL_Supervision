name: field-command-accessibility-cloud-ci
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/field-command-accessibility-cloud-ci.yml"
      - "apps/web/src/pages/CommandModal.tsx"
      - "apps/web/src/pages/CommandEvidencePicker.tsx"
      - "apps/web/src/pages/command-evidence-picker.css"
      - "apps/web/src/app/AppShell.tsx"
      - "tests_browser/quality-closed-loop.spec.ts"
      - "tests_browser/command-dialog-accessibility.spec.ts"
permissions:
  contents: read
jobs:
  command-dialog:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, doul-macmini]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install dependencies
        run: |
          npm install --global npm@12.2.0
          npm ci
          python -m venv .venv
          .venv/bin/pip install -r services/api/requirements.lock
      - name: Web compile and boundary checks
        run: |
          npm run check:ui-boundary
          npm run web:build
      - name: Connected browser dialog and evidence regression
        env:
          DOUL_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.config.ts command-dialog-accessibility.spec.ts quality-closed-loop.spec.ts
