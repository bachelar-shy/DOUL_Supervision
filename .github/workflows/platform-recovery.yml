name: platform-consistent-recovery
on:
  pull_request:
    paths: ['services/recovery/**', 'services/runtime_config.py', 'services/api/requirements.lock', 'infra/backup/**', 'infra/compose/**', 'tests_mvp/test_recovery.py', 'tests_runtime/recovery_live.py', '.github/workflows/platform-recovery.yml']
  push:
    branches: [main]
    paths: ['services/recovery/**', 'services/runtime_config.py', 'services/api/requirements.lock', 'infra/backup/**', 'infra/compose/**', 'tests_mvp/test_recovery.py', 'tests_runtime/recovery_live.py', '.github/workflows/platform-recovery.yml']
permissions:
  contents: read
jobs:
  clean-environment-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked runtime and verify unit safety gates
        run: |
          pip install -r services/api/requirements.lock
          python -m unittest discover -s tests_mvp -p test_recovery.py -v
          python infra/backup/test_postgres_backup.py -v
      - name: Start disposable source environment
        run: |
          docker compose -f infra/compose/compose.dev.yml -f infra/compose/compose.worker.yml \
            up -d --build --wait --wait-timeout 120 postgres redis api worker-runtime object-storage
          docker compose -f infra/compose/compose.dev.yml -f infra/compose/compose.worker.yml run --rm --no-deps object-storage-init
      - name: Quiesce, encrypt, restore into new targets and verify histories
        env:
          DATABASE_URL: postgresql://doul_dev:local-postgres-only@127.0.0.1:5432/doul_supervision
          REDIS_URL: redis://:local-redis-only@127.0.0.1:6379/0
          OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
          OBJECT_STORAGE_ACCESS_KEY: doul-dev
          OBJECT_STORAGE_SECRET_KEY: local-minio-only
          OBJECT_STORAGE_BUCKET: doul-supervision-dev
        run: python -m tests_runtime.recovery_live
      - name: Stop only the disposable CI environment
        if: always()
        run: docker compose -f infra/compose/compose.dev.yml -f infra/compose/compose.worker.yml down -v --remove-orphans
