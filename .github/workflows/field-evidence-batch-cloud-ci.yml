name: field-evidence-batch-cloud-ci
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/field-evidence-batch-cloud-ci.yml"
      - "apps/web/src/pages/CapturePage.tsx"
      - "packages/localization/src/index.ts"
      - "tests_browser_launch/capture-batch.spec.ts"
permissions:
  contents: read
jobs:
  capture-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install and compile
        run: |
          npm install -g npm@12.2.0
          npm ci
          npm run check:ui-boundary
          npm run web:build
      - name: Verify batch selection and persisted originals
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.field-core.config.ts capture-batch.spec.ts
