name: backend-worker-integration
on:
  pull_request:
    paths: ['services/**', 'tests_mvp/test_worker_jobs.py', 'tests_runtime/**', '.github/workflows/backend-worker-integration.yml', 'infra/compose/compose.worker.yml']
  push:
    branches: [main]
    paths: ['services/**', 'tests_mvp/test_worker_jobs.py', 'tests_runtime/**', '.github/workflows/backend-worker-integration.yml', 'infra/compose/compose.worker.yml']
permissions:
  contents: read
jobs:
  redis-worker:
    # Ephemeral GitHub-hosted runner; no Mac mini dependency.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4.11-alpine3.21
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: worker_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U integration -d worker_test" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked application runtime
        run: pip install -r services/api/requirements.lock
      - name: Durable outbox and authorization regressions
        run: python -m unittest discover -s tests_mvp -p 'test_worker_jobs.py' -v
      - name: Real Redis, PostgreSQL, process crash and graceful shutdown
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
          TEST_POSTGRES_DSN: postgresql://integration:disposable-ci-only@127.0.0.1:5432/worker_test
        run: python -m unittest discover -s tests_runtime -p 'test_worker_redis.py' -v
