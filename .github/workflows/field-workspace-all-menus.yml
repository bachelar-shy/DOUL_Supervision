name: field-workspace-all-menus
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/field-workspace-all-menus.yml'
      - 'apps/web/src/**'
      - 'playwright.field-layout.config.ts'
      - 'tests_browser_layout/all-menu-layout.spec.ts'
      - 'tests_browser_quick_role/field-layout-core.spec.ts'
      - 'tests_browser_launch/quiet-graphite-design.spec.ts'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: field-workspace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  all-menus-and-roles:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r services/api/requirements.lock
          npm ci
          npx playwright install --with-deps chromium
      - name: Build, lint and UI dependency boundaries
        env:
          VITE_DOUL_AUTH_MODE: password
        run: |
          npm run check:ui-boundary
          npm run lint --workspace apps/web
          npm run web:build
      - name: All stage-one menus and user roles (desktop and phone)
        run: npx playwright test -c playwright.quick-role.config.ts tests_browser_quick_role/field-layout-core.spec.ts
      - name: All available menu routes and global search
        run: npx playwright test -c playwright.field-layout.config.ts tests_browser_layout/all-menu-layout.spec.ts
      - name: Existing independent pane and document regression
        run: npx playwright test -c playwright.workspace-layout.config.ts tests_browser_layout/resizable-workspace.spec.ts
      - name: DOUL layout visual geometry 1440 1024 768 390
        run: npx playwright test -c playwright.field-core.config.ts tests_browser_launch/quiet-graphite-design.spec.ts
      - name: Upload failure traces and visual snapshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: field-workspace-layout-diagnostics
          path: |
            test-results/
            preview/screenshots/
          if-no-files-found: warn
          retention-days: 7
